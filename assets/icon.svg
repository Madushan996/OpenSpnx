<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="white" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="110" fill="url(#grad)"/>
  <!-- Subtle top shine -->
  <rect width="512" height="512" rx="110" fill="url(#shine)"/>

  <!-- Wallet body -->
  <rect x="76" y="148" width="360" height="236" rx="36" fill="white" opacity="0.12"/>
  <rect x="76" y="148" width="360" height="236" rx="36" fill="none" stroke="white" stroke-width="14" opacity="0.95"/>

  <!-- Horizontal divider (card slot) -->
  <line x1="76" y1="210" x2="436" y2="210" stroke="white" stroke-width="10" stroke-opacity="0.5"/>

  <!-- Coin circle (right side) -->
  <circle cx="348" cy="313" r="62" fill="white" opacity="0.18"/>
  <circle cx="348" cy="313" r="48" fill="white" opacity="0.95"/>

  <!-- $ text inside coin -->
  <text
    x="348" y="330"
    text-anchor="middle"
    font-family="'Arial Black', Arial, sans-serif"
    font-size="52"
    font-weight="900"
    fill="#16a34a"
    letter-spacing="-1"
  >$</text>

  <!-- Bill lines on left -->
  <rect x="104" y="254" width="196" height="14" rx="7" fill="white" opacity="0.75"/>
  <rect x="104" y="282" width="148" height="14" rx="7" fill="white" opacity="0.5"/>
  <rect x="104" y="310" width="108" height="14" rx="7" fill="white" opacity="0.3"/>
</svg>
